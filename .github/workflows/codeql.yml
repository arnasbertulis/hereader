name: codeql

on:
  push:
    branches: [main]
  # Filtered on this trigger only, not on push or the schedule: nothing
  # required gates on this workflow (unlike ci-java.yml and ci-dart.yml,
  # where a skipped required context would block the pull request forever),
  # so a native `paths:` filter is safe here. main and the weekly cron stay
  # unfiltered so the security baseline still runs against everything that
  # lands, not just what a filtered pull request happened to touch.
  #
  # The list covers what either matrix language can find something in:
  # java-kotlin scans server/ and app/android, javascript-typescript scans
  # the repo's one JS file. No language target exists for Dart, so the
  # packages and app/lib are not in this list.
  pull_request:
    paths:
      - 'server/**'
      - 'app/android/**'
      - 'app/web/drift_worker.js'
      - '.github/workflows/codeql.yml'
  schedule:
    # Catches CVEs disclosed against dependencies between pushes, not just
    # new code.
    - cron: '0 5 * * 1'

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers app/web/drift_worker.js, the one JS
        # file in the repo. No language target exists for Dart, so
        # app/, packages/rsvp_engine and packages/epub_reader get no
        # coverage from this workflow.
        #
        # java-kotlin build-mode is `none` (source scan, no compile) rather
        # than `autobuild`: app/android has exactly two source files,
        # MainActivity.kt and the Flutter-generated GeneratedPluginRegistrant
        # .java, both boilerplate with no first-party logic. Standing up a
        # full Flutter/NDK toolchain in this job to compile them is not worth
        # it for what a source scan already covers. The Gradle wrapper is
        # committed (previously gitignored, the stock `flutter create`
        # template) so CodeQL's own dependency-graph extraction can still run
        # `gradlew` and report precise dependencies instead of guessing from
        # package names.
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:${{ matrix.language }}'
