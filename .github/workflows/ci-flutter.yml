name: flutter

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished. Keyed on
# the ref, so two pull requests never cancel each other.
#
# Never on a push to main: the branch ruleset gates on the run against the
# pull request head, and a cancelled run here would leave the commit that
# is actually deployed from with no green run of its own. cd.yml goes
# further and never cancels at all, for a stronger reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `dart format`, not `flutter format`, which was removed. The rule is
      # the same one ci-dart.yml enforces on the pure packages: formatting
      # this package by hand for as long as CI did not check it is how a diff
      # ends up carrying reflowed lines nobody chose to touch.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Not `flutter test --platform chrome`. The suite constructs its
      # database through package:drift/native.dart, which reaches dart:ffi
      # and cannot compile to JS at all, so running these tests in a browser
      # is not a configuration problem to solve but a rewrite of every
      # database test onto drift's WASM setup.
      #
      # Building instead covers the compile-time half of the risk, and does
      # it against the exact artifact that gets served in production: the
      # 64-bit block-id hash failed here, not in a test, because web
      # compilers reject integer literals they cannot represent exactly.
      #
      # The define matches cd.yml's, so this builds what a deploy builds
      # rather than a localhost variant of it. Without it the check would
      # pass on a bundle nobody ever ships.
      - name: Build web
        run: flutter build web --dart-define=HEREADER_API=https://204-168-240-12.sslip.io/api