name: flutter

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `dart format`, not `flutter format`, which was removed. The rule is
      # the same one ci-dart.yml enforces on the pure packages: formatting
      # this package by hand for as long as CI did not check it is how a diff
      # ends up carrying reflowed lines nobody chose to touch.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # sqlite3.wasm is already shipped at web/sqlite3.wasm for the app's own
      # OPFS drift setup; the browser test run needs its own copy because
      # flutter_tools serves `<cwd>/test` at the test server's root, not
      # `<cwd>/web`. Gitignored — see app/.gitignore.
      - name: Copy sqlite3.wasm for the browser run
        run: cp web/sqlite3.wasm test/sqlite3.wasm

      # Runs the same suite again, this time compiled with DDC and executed
      # in a real Chrome instead of the Dart VM — the gap that let
      # `nextInt(1 << 32)` reach production, since that failure needs a
      # browser to reproduce and this is the first thing in CI that is one.
      #
      # This is not dart2js coverage: DDC and dart2js disagree on some
      # integer-width edges (JavaScript masks shift counts to five bits, so
      # `1 << 32` is `1` under DDC and `0` under dart2js), which is why
      # target-sensitive arithmetic still has to live in rsvp_engine /
      # epub_reader and be proven under ci-dart.yml's `dart test -p chrome`,
      # which does use dart2js. See ADR 0009.
      #
      # Chrome ships preinstalled on ubuntu-latest and flutter_tools launches
      # it headless, same as ci-dart.yml already relies on.
      #
      # The file list excludes the two suites marked @TestOn('vm')
      # (schema_migration_test.dart, web_shell_colors_test.dart) rather than
      # relying on that annotation alone: flutter_tools compiles every
      # discovered test file into one shared DDC bundle before any @TestOn
      # filtering happens (`generateTestEntrypoint` in
      # flutter_tools/lib/src/web/bootstrap.dart), so a file's own
      # `dart:ffi` or `dart:io` import breaks the whole run even though that
      # file would never execute on this platform. See ADR 0009.
      - name: Run tests (Chrome)
        run: >-
          flutter test --platform chrome
          $(find test -maxdepth 1 -name '*_test.dart'
          ! -name 'schema_migration_test.dart'
          ! -name 'web_shell_colors_test.dart')

      # Building covers the compile-time half of the risk against the exact
      # artifact that gets served in production: the 64-bit block-id hash
      # failed here, not in a test, because web compilers reject integer
      # literals they cannot represent exactly.
      #
      # The define matches cd.yml's, so this builds what a deploy builds
      # rather than a localhost variant of it. Without it the check would
      # pass on a bundle nobody ever ships.
      - name: Build web
        run: flutter build web --dart-define=HEREADER_API=https://204-168-240-12.sslip.io/api