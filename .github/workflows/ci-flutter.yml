name: flutter

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Explicit rather than relying on the default token grant: listing
    # `permissions:` at all replaces the default set for this job, so
    # `contents: read` for the checkout step has to be named alongside the
    # `pull-requests: read` that dorny/paths-filter's pull_request path
    # needs — it reads the changed-file list from the REST API rather than
    # git on that trigger.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dart: ${{ steps.filter.outputs.dart }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ADR 0001's path dependencies mean packages/rsvp_engine and
      # packages/epub_reader reach app with no publish and no version bump,
      # so a packages-only commit has to trip this filter exactly like an
      # app-only one. The workflow file itself is in the filter too — a
      # change to how the job runs is a reason to run it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dart:
              - 'app/**'
              - 'packages/rsvp_engine/**'
              - 'packages/epub_reader/**'
              - '.github/workflows/ci-flutter.yml'

  format-analyze:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `dart format`, not `flutter format`, which was removed. The rule is
      # the same one ci-dart.yml enforces on the pure packages: formatting
      # this package by hand for as long as CI did not check it is how a diff
      # ends up carrying reflowed lines nobody chose to touch.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  test:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  web-build:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Building covers the compile-time half of the risk against the exact
      # artifact that gets served in production: the 64-bit block-id hash
      # failed here, not in a test, because web compilers reject integer
      # literals they cannot represent exactly.
      #
      # The define and the --no-web-resources-cdn flag match cd.yml's, so
      # this builds what a deploy builds rather than a localhost variant of
      # it. Without it the check would pass on a bundle nobody ever ships.
      - name: Build web
        run: flutter build web --no-web-resources-cdn --dart-define=HEREADER_API=https://204-168-240-12.sslip.io/api

  # The required context on the main ruleset is "app", not any of the three
  # jobs above, so a documentation-only pull request — where changes.outputs.dart
  # is "false" and all three are skipped — still needs something to report
  # that context. `if: always()` is what lets this job run even though its
  # needs did not: a plain `needs:` job is itself skipped when anything it
  # depends on is skipped, which would make "app" a required context that
  # can never turn green on a documentation-only change.
  app:
    needs: [changes, format-analyze, test, web-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # `changes` itself is never skipped, so it is held to `success` alone —
      # otherwise a failed `changes` run would leave the three fan-out jobs
      # skipped as its dependents and this loop would read that as green.
      # For the fan-out, a skipped job is success — that is the entire point
      # of gating on `changes` — and only failure or cancellation fails the
      # gate.
      - name: Require the fan-out to have succeeded or been skipped
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes reported ${{ needs.changes.result }}"
            exit 1
          fi
          for result in "${{ needs.format-analyze.result }}" "${{ needs.test.result }}" "${{ needs.web-build.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::a required job reported $result"
              exit 1
            fi
          done
