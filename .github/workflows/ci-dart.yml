name: dart

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished. Keyed on
# the ref, so two pull requests never cancel each other.
#
# Never on a push to main: the branch ruleset gates on the run against the
# pull request head, and a cancelled run here would leave the commit that
# is actually deployed from with no green run of its own. cd.yml goes
# further and never cancels at all, for a stronger reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rsvp_engine, epub_reader]

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests (VM)
        run: dart test

      # dart2js semantics differ from the VM in ways the run above cannot
      # see: `int` is a JS double, exact only to 2^53, and `<<` is a 32-bit
      # operation, so `1 << 32` is 0. Both shipped bugs came from this.
      #
      # epub_golden_test.dart is annotated @TestOn('vm') — it reads its
      # fixture through dart:io and a browser has no filesystem.
      # block_id_test.dart carries the hash coverage on both platforms.
      #
      # Chrome ships preinstalled on ubuntu-latest and dart test runs it
      # headless, so this needs no extra setup.
      - name: Run tests (Chrome)
        run: dart test -p chrome