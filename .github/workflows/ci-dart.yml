name: dart

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [rsvp_engine, epub_reader]

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    # Explicit rather than relying on the default token grant: listing
    # `permissions:` at all replaces the default set for this job, so
    # `contents: read` for the checkout step has to be named alongside the
    # `pull-requests: read` that dorny/paths-filter's pull_request path
    # needs.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A gate job would need its own matrix over the same package list to
      # produce per-package outputs, for no gain over asking the question
      # once per matrix job instead — this step runs once per package
      # already. `matrix.package` is baked into the filter pattern, so each
      # instance only asks about its own directory: the packages do not
      # depend on the app, so an app-only change should not wake either one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            changed:
              - 'packages/${{ matrix.package }}/**'
              - '.github/workflows/ci-dart.yml'

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        if: steps.filter.outputs.changed == 'true'

      - name: Install dependencies
        if: steps.filter.outputs.changed == 'true'
        run: dart pub get

      - name: Verify formatting
        if: steps.filter.outputs.changed == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.filter.outputs.changed == 'true'
        run: dart analyze --fatal-infos

      - name: Run tests (VM)
        if: steps.filter.outputs.changed == 'true'
        run: dart test

      # dart2js semantics differ from the VM in ways the run above cannot
      # see: `int` is a JS double, exact only to 2^53, and `<<` is a 32-bit
      # operation, so `1 << 32` is 0. Both shipped bugs came from this.
      #
      # epub_golden_test.dart is annotated @TestOn('vm') — it reads its
      # fixture through dart:io and a browser has no filesystem.
      # block_id_test.dart carries the hash coverage on both platforms.
      #
      # Chrome ships preinstalled on ubuntu-latest and dart test runs it
      # headless, so this needs no extra setup.
      - name: Run tests (Chrome)
        if: steps.filter.outputs.changed == 'true'
        run: dart test -p chrome