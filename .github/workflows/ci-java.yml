name: java

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # Integration tests run against a real Postgres rather than an in-memory
    # substitute: the schema uses jsonb, uuid and Flyway migrations, none of
    # which behave the same on H2.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hereader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/hereader_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test
      # Test-only, and long enough to satisfy the HS256 minimum. The real
      # secret is set in the deployment environment and never committed.
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: always()
        with:
          report_paths: server/target/surefire-reports/TEST-*.xml
