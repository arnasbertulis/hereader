name: java

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # Integration tests run against a real Postgres rather than an in-memory
    # substitute: the schema uses jsonb, uuid and Flyway migrations, none of
    # which behave the same on H2.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hereader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/hereader_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test
      # Test-only, and long enough to satisfy the HS256 minimum. The real
      # secret is set in the deployment environment and never committed.
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: server/target/surefire-reports/TEST-*.xml
