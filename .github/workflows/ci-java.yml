name: java

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request supersedes the first, so the run against
# the commit nobody will merge is cancelled rather than finished.
#
# The group is head_ref on a pull request — the source branch, shared by
# every push to it — falling back to the sha on a push to main, where
# head_ref is empty. Each main commit therefore gets a group of its own,
# which is the point: cancel-in-progress does not mean "leave the other run
# alone", it means "queue behind it", so one shared main group would make
# the second of two quick merges wait out the first before starting. A
# group of one has nothing to queue behind and nothing to cancel, and the
# run against a tagged commit is the only test evidence it ever gets —
# cd.yml builds and deploys, it does not test.
#
# cd.yml is the deliberate opposite, for a reason it states itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Explicit rather than relying on the default token grant: listing
    # `permissions:` at all replaces the default set for this job, so
    # `contents: read` for the checkout step has to be named alongside the
    # `pull-requests: read` that dorny/paths-filter's pull_request path
    # needs — it reads the changed-file list from the REST API rather than
    # git on that trigger.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci-java.yml'

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # mikepenz/action-junit-report needs checks: write to create the check
    # run it publishes results to; contents: read replaces what actions/
    # checkout would otherwise get from the default token.
    permissions:
      contents: read
      checks: write

    defaults:
      run:
        working-directory: server

    # Integration tests run against a real Postgres rather than an in-memory
    # substitute: the schema uses jsonb, uuid and Flyway migrations, none of
    # which behave the same on H2.
    #
    # Declared at job level, so it starts as soon as the job is scheduled,
    # before any step's `if:` runs — the gate above is what stops the
    # container being paid for, not a step-level condition inside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hereader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/hereader_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test
      # Test-only, and long enough to satisfy the HS256 minimum. The real
      # secret is set in the deployment environment and never committed.
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256-signing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: always()
        with:
          report_paths: server/target/surefire-reports/TEST-*.xml

  # The required context on the main ruleset is "server", not "build", so a
  # documentation-only pull request — where changes.outputs.server is
  # "false" and build is skipped — still needs something to report that
  # context. `if: always()` is what lets this job run even though its needs
  # did not: a plain `needs:` job is itself skipped when anything it depends
  # on is skipped, which would make "server" a required context that can
  # never turn green on a documentation-only change.
  server:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # `changes` itself is never skipped, so it is held to `success` alone —
      # otherwise a failed `changes` run would leave `build` skipped as its
      # dependent and this check would read that as green. For `build`, a
      # skipped result is success — that is the entire point of gating on
      # `changes` — and only failure or cancellation fails the gate.
      - name: Require the build to have succeeded or been skipped
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes reported ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "::error::build reported ${{ needs.build.result }}"
            exit 1
          fi
