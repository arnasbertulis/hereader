name: deploy

# Deploys are tagged, not triggered by a merge. The three CI workflows are
# separate files and cannot gate each other, so a push-to-main trigger would
# race them; a tag is applied to a commit whose checks have already gone
# green under the branch ruleset. It also gives every release a name that is
# not a sha, which is what a rollback needs to be able to say.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One deploy at a time, and never cancelled part-way: the second half of this
# is `docker compose up -d` on a live server.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The deployed hostname is a real domain (ADR 0006 amendment) that points
  # at the server via a DNS A record, not derived from its IP. Moving the
  # server means repointing DNS, not editing this string; changing the
  # hostname itself still means updating here and in ci-flutter.yml, and
  # nothing in the app's own source.
  HEREADER_API: https://hereader.arnasbertulis.com/api
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/hereader-server
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/hereader-web

jobs:
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building here rather than on the VPS. The CX22 has 2 vCPU and 4GB of
      # RAM shared with a running JVM and Postgres, and `docker compose up
      # --build` ran a full Maven build against exactly that.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Validate tag matches pubspec.yaml and export version info
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Deploy requires a tag push (git push origin vX.Y.Z). workflow_dispatch on a non-tag ref is not supported."
            exit 1
          fi

          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          PUBSPEC_VERSION=$(sed 's/\r$//' app/pubspec.yaml | grep '^version:' | sed 's/version: //' | sed 's/+.*//')

          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app/pubspec.yaml version ($PUBSPEC_VERSION). Ensure the tag vX.Y.Z matches the pubspec version X.Y.Z before deploying."
            exit 1
          fi

          BUILD_NUMBER=$(git tag -l 'v*' --merged "${{ github.ref_name }}" | wc -l)

          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          echo "Deploying version $TAG_VERSION (build $BUILD_NUMBER)"

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      # Without the define, HEREADER_API falls back to localhost:8080 and the
      # bundle builds, deploys and serves perfectly while every sync request
      # from it goes to the reader's own machine.
      #
      # --no-web-resources-cdn keeps CanvasKit's JS and .wasm in the bundle
      # this build already writes to build/web/canvaskit/, instead of
      # resolving flutter_bootstrap.js's buildConfig to Google's CDN at
      # runtime (docs/adr/0028-content-security-policy.md, #160).
      #
      # --build-name and --build-number are derived from the git tag and exported
      # by the validation step, so the About screen (via PackageInfo.fromPlatform())
      # reports the correct release version instead of the pubspec default.
      - name: Build web
        run: flutter build web --no-web-resources-cdn --dart-define=HEREADER_API=$HEREADER_API --build-name=$TAG_VERSION --build-number=$BUILD_NUMBER
        working-directory: app

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: app/build/web
          file: app/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Gates deploy rather than either image build, so the graph stays parallel
  # — images build while this runs — and the gate sits immediately before the
  # only irreversible step in the workflow. This is the same run
  # flutter-nightly.yml does; the nightly copy is the early warning, this one
  # is what actually stops a bad run from reaching production.
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # sqlite3.wasm is already shipped at web/sqlite3.wasm for the app's own
      # OPFS drift setup; the browser test run needs its own copy because
      # flutter_tools serves `<cwd>/test` at the test server's root, not
      # `<cwd>/web`. Gitignored — see app/.gitignore.
      #
      # A script rather than the `cp` this used to be, because it is not the
      # only thing that has to be staged: on Windows the engine's CanvasKit
      # build has to be copied into `test/` as well, or the run hangs after
      # Chrome launches. That half is invisible here — ubuntu-latest does not
      # need it and the script skips it — which is precisely why it belongs in
      # a file this step also runs. Written in two places, only one of them
      # learned about CanvasKit. See app/README.md's Testing section.
      - name: Stage the browser run's assets
        run: dart run tool/stage_chrome_test_assets.dart

      # Runs the same suite again, this time compiled with DDC and executed
      # in a real Chrome instead of the Dart VM — the gap that let
      # `nextInt(1 << 32)` reach production, since that failure needs a
      # browser to reproduce and this is the first thing in CI that is one.
      #
      # This is not dart2js coverage: DDC and dart2js disagree on some
      # integer-width edges (JavaScript masks shift counts to five bits, so
      # `1 << 32` is `1` under DDC and `0` under dart2js), which is why
      # target-sensitive arithmetic still has to live in rsvp_engine /
      # epub_reader and be proven under ci-dart.yml's `dart test -p chrome`,
      # which does use dart2js. See ADR 0009.
      #
      # Chrome ships preinstalled on ubuntu-latest and flutter_tools launches
      # it headless, same as ci-dart.yml already relies on.
      #
      # The file list is built by reading the @TestOn('vm') marker rather
      # than by trusting it: flutter_tools compiles every discovered test
      # file into one shared DDC bundle before any @TestOn filtering happens
      # (`generateTestEntrypoint` in flutter_tools/lib/src/web/bootstrap.dart),
      # so a file's own `dart:ffi` or `dart:io` import breaks the whole run
      # even though that file would never execute on this platform. The
      # annotation is therefore necessary but not sufficient, and the file
      # has to be kept out of the argument list too. `grep -L` states that
      # intent — run every suite not marked VM-only — so the next VM-only
      # file is handled without anyone remembering this step exists. Three
      # files today: android_device_transfer_backup_test.dart,
      # schema_migration_test.dart and web_shell_colors_test.dart. See ADR
      # 0009.
      #
      # --timeout 60s, against a suite whose slowest test takes about two
      # seconds. The ten-minute default is why a single hanging test once
      # cost 25 minutes of runner time and produced no pass/fail list at all;
      # timeout-minutes is the backstop for a hang outside any test, sized
      # from a local run of about five minutes.
      - name: Run tests (Chrome)
        timeout-minutes: 15
        run: >-
          flutter test --platform chrome --timeout 60s
          $(grep -L "@TestOn('vm')" test/*_test.dart)

  deploy:
    needs: [server-image, web-image, browser-test]
    runs-on: ubuntu-latest
    environment: production
    # A deploy that fails its health check waits 150 s, then the rollback
    # pulls images and waits another 150 s.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Only the scripts this job runs, so the job holding the server
      # credential does not also hold the whole tree or a stored token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Written by hand rather than through an ssh-agent action. This is the
      # one step of the pipeline holding a credential that reaches the
      # server, and four lines of shell are a smaller thing to trust than a
      # third-party action on that step.
      #
      # The host key is pinned from a secret, not read with ssh-keyscan at
      # deploy time — a keyscan trusts whatever answers, which is no check
      # at all on the connection it is meant to be checking.
      - name: Prepare the SSH client
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

          # A host key is public by construction, so printing its fingerprint
          # leaks nothing and turns the one failure this step can produce into
          # a readable one. ssh's answer to a mismatch is REMOTE HOST
          # IDENTIFICATION HAS CHANGED, which names the fingerprint the server
          # sent and not the one it was compared against, so without this the
          # log shows a break-in warning and no way to tell a mangled secret
          # from a real one. It also fails the step outright on a secret that
          # is not a parseable host key at all, rather than letting that
          # surface later as the same alarming message.
          echo "Pinned host key:"
          ssh-keygen -lf ~/.ssh/known_hosts

      # The key is restricted to server/deploy.sh by a forced command in
      # authorized_keys, so this whole string arrives there as
      # SSH_ORIGINAL_COMMAND and is pattern-checked before it reaches git.
      #
      # The server prints the release it is replacing, and the script keeps
      # it as the `previous` output for the rollback below. If it prints none
      # the run warns and carries on; there is just nothing to roll back to.
      - name: Deploy
        id: deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-release.sh

      # See wait-healthy.sh for what the check means and why the rollback
      # shares it.
      - name: Wait for the service to answer
        id: health
        run: bash .github/scripts/wait-healthy.sh

      # Runs when either step above failed, and exits 1 whatever it finds: a
      # release that fails its health check is a failed run even when the
      # service is back up on the one before it. The previous release is
      # redeployed through the same forced command rather than by editing
      # .env on the box, which would leave the new compose.yaml and Caddyfile
      # in place. It only works while the older image can start against the
      # newer schema (ADR 0023, second amendment).
      - name: Roll back to the previous release
        if: failure() && steps.deploy.outputs.previous != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ steps.deploy.outputs.previous }}
        run: bash .github/scripts/rollback-release.sh
