name: deploy-drift

# Deploys run from a `v*` tag, not from a merge (ADR 0023), so a change on
# `main` does not ship. That is deliberate; what was missing was anything
# saying how far the deployed site had fallen behind. This reports it and
# does nothing else: it never deploys, and it fails no check a merge waits on.
#
# The report is one open issue, found by its exact title and edited in place,
# so a gap that lasts a week is one issue and not seven. A failing run was the
# alternative, and it would colour the Actions tab red for a state that is
# intended. The issue closes itself when the next tag catches up.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-drift
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Deployed site is behind main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare the latest tag with main
        run: |
          set -euo pipefail

          tag=$(git describe --tags --abbrev=0 --match 'v*' origin/main)
          ahead=$(git rev-list --count "$tag..origin/main")

          # Compared by exact title against the open list rather than by
          # search, which is eventually consistent and would let a second run
          # open a duplicate straight after the first.
          existing=$(gh issue list --state open --limit 200 \
            --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")

          if [ "$ahead" -eq 0 ]; then
            echo "main is at $tag; nothing to report."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --reason completed \
                --comment "main and $tag are the same commit again."
            fi
            exit 0
          fi

          {
            echo "\`main\` is $ahead commit(s) ahead of \`$tag\`, the latest release tag."
            echo
            echo "Deploys run from a \`v*\` tag (ADR 0023), so none of these are live."
            echo
            echo "Changes not yet deployed, newest first:"
            echo
            git log --no-merges -n 50 --format='- %h %s' "$tag..origin/main"
            if [ "$ahead" -gt 50 ]; then
              echo "- ... and more; the list is capped at 50."
            fi
            echo
            echo "Last checked $(date -u +%Y-%m-%dT%H:%MZ). This issue is edited in place by the \`deploy-drift\` workflow and closes when a tag catches up."
          } > body.md

          cat body.md >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Updated issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
