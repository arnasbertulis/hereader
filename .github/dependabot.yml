version: 2

updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(app)"
    ignore:
    # flutter_secure_storage 11 needs win32 ^6.0.1; file_picker 11.0.3 pins
    # win32 ^5.9.0 and has no stable release that moves. Taking 11 means
    # taking file_picker 12.0.0-beta.7, a prerelease on the book import
    # path, which the deployed web build exercises first. Revisit when
    # file_picker 12 is stable.
    - dependency-name: "flutter_secure_storage"
      update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /packages/rsvp_engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(rsvp)"

  - package-ecosystem: pub
    directory: /packages/epub_reader
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(epub)"

  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(server)"
    ignore:
      - dependency-name: "org.springframework.*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"