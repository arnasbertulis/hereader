name: Bug report
description: Something is broken or behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: dropdown
    id: target
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Web
        - Server (API)
        - Not platform-specific
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Paste as text, not a screenshot, so it's searchable.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else worth knowing
      description: Whether it reproduces consistently, when it started, anything you already ruled out.
    validations:
      required: false
