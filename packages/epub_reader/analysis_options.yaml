# Static analysis for the EPUB parser.
#
# Additions to `lints/recommended`, matching the app and `rsvp_engine` so one
# rule does not mean two things depending on which directory it fires in.
#
# `no_adjacent_strings_in_list` was tried and removed: the test fixtures wrap
# long single strings across lines inside list literals, which the rule
# cannot tell from a missing comma. See the PR for the reasoning.

include: package:lints/recommended.yaml

linter:
  rules:
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - directives_ordering