# Static analysis for the reading engine.
#
# Additions to `lints/recommended`, matching the app's set so one rule does
# not mean two things depending on which directory it fires in. This package
# could be published independently (ADR 0001), so a leaked subscription or an
# unclosed controller here would be a consumer's problem rather than only
# this project's.

include: package:lints/recommended.yaml

linter:
  rules:
    - unawaited_futures
    - cancel_subscriptions

    # PlaybackSession owns a broadcast controller for the lifetime of a book.
    - close_sinks

    - directives_ordering