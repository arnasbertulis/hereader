services:
  db:
    image: postgres:17
    container_name: hereader-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hereader
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # `image` and `build` together: the deployed stack pulls the tag CI pushed,
  # while `docker compose build` on a developer's machine still produces a
  # local image under the same name. HEREADER_TAG is written into .env by
  # server/deploy.sh, so a manual `docker compose up -d` on the server later
  # brings up the release that is already running rather than whatever
  # :latest has become since.
  app:
    image: ghcr.io/arnasbertulis/hereader-server:${HEREADER_TAG:-local}
    build: .
    container_name: hereader-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hereader
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  # Caddy plus the compiled web bundle, built by CI from app/web.Dockerfile.
  # It has no `build` stanza because building it needs a `flutter build web`
  # to have run first, and because ADR 0006 already establishes that this
  # layer cannot be exercised locally at all: the sslip.io hostname resolves
  # to the server's IP, so a local Caddy fails its ACME challenge. Local
  # work runs `docker compose up db app` and talks to the service directly.
  caddy:
    image: ghcr.io/arnasbertulis/hereader-web:${HEREADER_TAG:-local}
    container_name: hereader-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config: