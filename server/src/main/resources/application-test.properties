# Used by tests through @ActiveProfiles("test").
#
# Points at a separate database so a test run cannot wipe or interfere with
# whatever is in the development one. Locally that means creating it once:
#
#   docker exec hereader-db psql -U postgres -c "create database hereader_test"

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hereader_test}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev}

spring.flyway.enabled=true

# Fixed test secret. Startup would fail without one, and using the developer's
# real secret in tests would mean tokens minted by a test run are valid
# against their running server.
hereader.jwt.secret=${JWT_SECRET:test-secret-long-enough-for-hs256-signing-in-tests}

logging.level.org.springframework.web=WARN
logging.level.org.flywaydb=WARN

# High enough that AuthControllerIntegrationTest's ~20 calls from one MockMvc
# client don't trip it. AuthRateLimitFilterTest overrides this per-test to a
# low number to exercise the limit itself.
hereader.auth-rate-limit.requests-per-minute=10000

# Same reasoning as the auth budget above; CatalogueSearchRateLimitFilterTest,
# CatalogueCategoriesRateLimitFilterTest and CatalogueLanguagesRateLimitFilterTest
# override this per-test to a low number to exercise the limit itself.
hereader.catalogue-search-rate-limit.requests-per-minute=10000
hereader.catalogue-categories-rate-limit.requests-per-minute=10000
hereader.catalogue-languages-rate-limit.requests-per-minute=10000
hereader.catalogue-cover-rate-limit.requests-per-minute=10000
hereader.catalogue-download-rate-limit.requests-per-minute=10000
