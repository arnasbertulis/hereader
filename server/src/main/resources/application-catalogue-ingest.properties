# Active only for the manual ingestion trigger (CatalogueIngestionRunner):
#
#   docker exec hereader-server java -jar app.jar --spring.profiles.active=catalogue-ingest
#
# server.port=0 rather than disabling the web server outright
# (spring.main.web-application-type=none): SecurityConfig's filterChain bean
# needs an HttpSecurity bean, which Spring Security only registers for a
# servlet web application. Binding to an OS-assigned port instead avoids
# colliding with the instance already holding 8080 in the same container.
server.port=0
