spring.application.name=hereader-server

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hereader}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev}

spring.flyway.enabled=true

logging.level.org.springframework.security=INFO

hereader.jwt.secret=${JWT_SECRET}
hereader.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
hereader.jwt.refresh-token-days=${JWT_REFRESH_DAYS:60}
hereader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://204-168-240-12.sslip.io}
server.servlet.context-path=/api