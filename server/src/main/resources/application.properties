spring.application.name=hereader-server

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hereader}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev}

spring.flyway.enabled=true

logging.level.org.springframework.security=INFO

hereader.jwt.secret=${JWT_SECRET}
hereader.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
hereader.jwt.refresh-token-days=${JWT_REFRESH_DAYS:60}
hereader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://204-168-240-12.sslip.io}
server.servlet.context-path=/api

# Requests per minute per client IP against /auth/**. Load-bearing alongside
# server.forward-headers-strategy below: without it, every caller behind
# Caddy shares one bridge address and is throttled as a single client.
hereader.auth-rate-limit.requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
server.forward-headers-strategy=framework

# The bulk catalogue export Ingestion reads (ADR 0029). A configuration
# property rather than a literal so a test can point it at a local stub.
hereader.catalogue.gutenberg-catalog-csv-url=${GUTENBERG_CATALOG_CSV_URL:https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv}