spring.application.name=hereader-server

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hereader}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev}

spring.flyway.enabled=true

logging.level.org.springframework.security=INFO

hereader.jwt.secret=${JWT_SECRET}
hereader.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:60}
hereader.jwt.refresh-token-days=${JWT_REFRESH_DAYS:60}
hereader.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://204-168-240-12.sslip.io}
server.servlet.context-path=/api

# Requests per minute per client IP against /auth/**. Load-bearing alongside
# server.forward-headers-strategy below: without it, every caller behind
# Caddy shares one bridge address and is throttled as a single client.
hereader.auth-rate-limit.requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
server.forward-headers-strategy=framework

# The bulk catalogue export Ingestion reads (ADR 0029). A configuration
# property rather than a literal so a test can point it at a local stub.
hereader.catalogue.gutenberg-catalog-csv-url=${GUTENBERG_CATALOG_CSV_URL:https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv}

# Requests per minute per client IP against /catalogue/search. Higher than
# /auth's: browsing is read-only and unauthenticated, so the concern is
# scraping rather than an amplified write.
hereader.catalogue-search-rate-limit.requests-per-minute=${CATALOGUE_SEARCH_RATE_LIMIT_PER_MINUTE:60}

# Requests per minute per client IP against /catalogue/cover and
# /catalogue/download respectively (ADR 0029). Separate budgets: one flick of
# a browse grid is dozens of cover requests, where ten downloads a minute is
# already generous for one reader.
hereader.catalogue-cover-rate-limit.requests-per-minute=${CATALOGUE_COVER_RATE_LIMIT_PER_MINUTE:300}
hereader.catalogue-download-rate-limit.requests-per-minute=${CATALOGUE_DOWNLOAD_RATE_LIMIT_PER_MINUTE:10}

# Gutenberg's book-file and cover URL conventions (ADR 0029). "{id}" is
# substituted with the Gutenberg book number. The no-images edition is not
# announced in upstream metadata, only reachable by this convention — a book
# without one 404s and CatalogueProxyService falls back to the images one.
hereader.catalogue.gutenberg-cover-url-template=${GUTENBERG_COVER_URL_TEMPLATE:https://www.gutenberg.org/cache/epub/{id}/pg{id}.cover.medium.jpg}
hereader.catalogue.gutenberg-epub-noimages-url-template=${GUTENBERG_EPUB_NOIMAGES_URL_TEMPLATE:https://www.gutenberg.org/cache/epub/{id}/pg{id}.epub}
hereader.catalogue.gutenberg-epub-images-url-template=${GUTENBERG_EPUB_IMAGES_URL_TEMPLATE:https://www.gutenberg.org/cache/epub/{id}/pg{id}-images.epub}

# Client request timeout for the cover and download proxies, so a caller
# waiting on a synchronous request is not left hanging on an upstream that
# never answers.
hereader.catalogue.gutenberg-http-timeout-seconds=${GUTENBERG_HTTP_TIMEOUT_SECONDS:10}

# Where fetched covers are cached (ADR 0029) — bounded by the Catalogue's own
# size (roughly 1.5GB were every cover ever requested), not by an eviction
# policy. compose.yaml mounts this path to a named volume in the deployed
# container; the system temp directory is the development default.
hereader.catalogue.cover-cache-dir=${CATALOGUE_COVER_CACHE_DIR:${java.io.tmpdir}/hereader-catalogue-covers}