# Static analysis for the Flutter app.
#
# The rules below are additions to `flutter_lints`. Each one describes a
# discipline this project already keeps by hand; turning it on makes the
# next lapse a failed check rather than a bug found later.
#
# `flutter analyze` runs in CI on every push and fails on any issue here,
# so a rule added is a rule enforced.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # A Future started and abandoned must say so. Every deliberate
    # fire-and-forget in this app is already wrapped in `unawaited()` with a
    # comment explaining why the result is dropped; the one that was not is
    # what prompted this rule. On the position-saving path a silently
    # dropped Future is a place that never reaches disk.
    - unawaited_futures

    # A subscription outliving its State keeps a closure — and everything it
    # captures — alive after dispose. Both subscriptions here listen to a
    # PlaybackSession, which holds the whole token list of a book.
    - cancel_subscriptions

    # If this fires on a controller that is genuinely closed, remove the rule
    # rather than adding an ignore. A suppressed lint teaches the next reader
    # that the rule is noise, which is worse than not having it.
    - close_sinks

    # Import order drifts silently and is invisible in review.
    - directives_ordering