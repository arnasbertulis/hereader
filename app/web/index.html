<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="hereader: a configurable RSVP reading app for low-vision readers.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hereader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hereader</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The colour behind the loader, before Flutter has painted anything.

    Without this the browser paints white while the engine, the WASM SQLite
    module and the OPFS handle come up, so a dark-theme device flashes white
    on every cold start. It does not fix a start that hangs — the startup
    failure screen is what says something went wrong — but it stops a slow
    one from looking like a dead page.

    Follows the browser's own preference rather than the reader's stored
    theme: that setting lives in OPFS, behind the engine this markup is
    waiting for. A reader who chose Light on a dark-preference device still
    sees a dark loader for a moment.

    Both values are `surface` from `app/lib/theme/app_colors.dart`.
    `app/test/web_shell_colors_test.dart` fails if they drift apart.
  -->
  <meta name="color-scheme" content="light dark">
  <style>
    html, body { margin: 0; padding: 0; background-color: #FBFBFC; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #121416; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
